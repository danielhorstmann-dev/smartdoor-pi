<!DOCTYPE html>

<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartDoor Zentrale</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main>

        <h1>SmartDoor Zentrale</h1>

        <div class="status">

            <p>
                Licht:
                <strong id="licht">
                    unbekannt
                </strong>
            </p>

            <p>
                Schloss:
                <strong id="schloss">
                    unbekannt
                </strong>
            </p>

            <p>
                Bewegung:
                <strong id="bewegung">
                    unbekannt
                </strong>
            </p>

            <p>
                Helligkeit:
                <strong id="helligkeit">
                    0
                </strong>
            </p>

        </div>

        <h2>Steuerung</h2>

        <div class="steuerung">

            <h3>Licht</h3>

            <button onclick="lichtAn()">
                Licht AN
            </button>

            <button onclick="lichtAus()">
                Licht AUS
            </button>


            <h3>Tür</h3>

            <button onclick="tuerEntriegeln()">
                Tür entriegeln
            </button>

            <button onclick="tuerVerriegeln()">
                Tür verriegeln
            </button>


            <h3>Lichtautomatik</h3>

            <button onclick="automatikAn()">
                Automatik AN
            </button>

            <button onclick="automatikAus()">
                Automatik AUS
            </button>
            

            <h3>PIN ändern</h3>

            <input id="altePin" type="password" placeholder="Aktuelle PIN">

            <input id="neuePin" type="password" placeholder="Neue PIN">

            <input id="pinBestaetigung" type="password" placeholder="Neue PIN wiederholen">

            <button onclick="pinAendern()">
                PIN ändern
            </button>


            <h3>Admin PIN-Reset</h3>

            <input id="resetNeuePin" type="password" placeholder="Neue PIN">

            <input id="resetBestaetigung" type="password" placeholder="Neue PIN wiederholen">

            <button onclick="pinZuruecksetzen()">
                PIN zurücksetzen
            </button>

        </div>

    </main>

    <script src="/static/script.js"></script>

</body>

</html>
